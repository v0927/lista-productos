<div class="container">
  <header>
    <h1>{{ title | uppercase }}</h1>
    <p class="fecha">{{ fechaActual | date:'fullDate' }}</p>
  </header>

  <main>
    <div class="controles">
      <button (click)="toggleLista()" class="btn-toggle">
        {{ mostrarLista ? 'Ocultar Lista' : 'Mostrar Lista' }}
      </button>
    </div>

    <div *ngIf="mostrarLista" class="lista-seccion">
      <h2>Productos Disponibles</h2>
      
      <div class="productos-grid">
        <app-producto-card 
          *ngFor="let producto of productos"
          [nombreProducto]="producto.nombre">
        </app-producto-card>
      </div>
    </div>

    <div class="agregar-seccion">
      <h2>Agregar Nuevo Producto</h2>
      <div class="form-group">
        <input 
          type="text" 
          [(ngModel)]="nuevoProducto"
          placeholder="Nombre del producto"
          class="input-producto"
          (keyup.enter)="agregarProducto()">
        <button (click)="agregarProducto()" class="btn-agregar">
          Agregar Producto
        </button>
      </div>
    </div>
  </main>
</div>
